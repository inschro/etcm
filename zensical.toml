[project]
site_name = "ETCM"
site_description = "Typed Configuration Markup for reproducible typed config graphs."
site_author = "ETCM contributors"
site_url = "https://inschro.github.io/etcm/"
repo_url = "https://github.com/inschro/etcm"
repo_name = "inschro/etcm"
edit_uri = "edit/main/documentation/"
copyright = "Copyright &copy; 2026 ETCM contributors"
docs_dir = "documentation"
site_dir = "site"
nav = [
    { "Home" = "index.md" },
    { "Get started" = [
        { "Installation" = "getting-started/installation.md" },
        { "Quickstart" = "getting-started/quickstart.md" },
    ] },
    { "Guides" = [
        { "Core concepts" = "guides/core-concepts.md" },
        { "Composition" = "guides/composition.md" },
        { "Validation and derived values" = "guides/validation.md" },
        { "Overrides" = "guides/overrides.md" },
        { "Typed files" = "guides/typed-files.md" },
    ] },
    { "Reference" = [
        { "Language" = "reference/language.md" },
        { "Python API" = "reference/python-api.md" },
        { "CLI" = "reference/cli.md" },
    ] },
]

[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "content.code.select",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
